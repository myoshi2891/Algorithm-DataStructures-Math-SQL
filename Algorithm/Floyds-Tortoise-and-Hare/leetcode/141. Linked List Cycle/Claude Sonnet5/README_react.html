<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>LeetCode 141: Linked List Cycle - 亀と兎のアルゴリズムで解説</title>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap"
            rel="stylesheet"
        />

        <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
        <script
            src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
            crossorigin
        ></script>
        <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
        <script src="https://cdn.tailwindcss.com"></script>

        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.css"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/toolbar/prism-toolbar.min.css"
        />

        <script>
            window.Prism = window.Prism || {};
            window.Prism.manual = true; // Reactが描画した後に手動でハイライトするため自動実行を止める
        </script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/toolbar/prism-toolbar.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/copy-to-clipboard/prism-copy-to-clipboard.min.js"></script>
        <script src="/vendor/mermaid/mermaid.min.js"></script>

        <style>
            html {
                scroll-behavior: smooth;
            }
            body {
                font-family: 'Inter', sans-serif;
                background: linear-gradient(180deg, #f0fdf4, #e0f2fe);
            }
            .outfit {
                font-family: 'Outfit', sans-serif;
            }
            code,
            pre {
                font-family: 'JetBrains Mono', monospace;
            }

            *:focus-visible {
                outline: 3px solid #0ea5e9;
                outline-offset: 2px;
                border-radius: 4px;
            }

            @keyframes stepFadeIn {
                from {
                    opacity: 0;
                    transform: translateY(6px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
            .step-panel-anim {
                animation: stepFadeIn 0.35s ease;
            }

            @media (prefers-reduced-motion: reduce) {
                * {
                    animation: none !important;
                    transition: none !important;
                }
                html {
                    scroll-behavior: auto;
                }
            }

            .code-toolbar > .toolbar .toolbar-item a,
            .code-toolbar > .toolbar .toolbar-item button,
            .code-toolbar > .toolbar .toolbar-item span {
                background: #10b981 !important;
                color: white !important;
                border-radius: 6px !important;
                padding: 3px 10px !important;
                font-size: 12px !important;
                border: none !important;
                cursor: pointer !important;
            }

            pre[class*='language-'] {
                border-radius: 0.75rem !important;
                font-size: 0.8rem !important;
                line-height: 1.7 !important;
            }

            .mermaid-container svg {
                max-width: 100%;
                height: auto;
                display: block;
                margin: 0 auto;
            }
        </style>
    </head>
    <body>
        <div id="root"></div>

        <script type="text/babel">
            const { useState, useEffect, useRef } = React;

            /* ============ ヘッダー ============ */
            function Header() {
                const navItems = [
                    { href: '#overview', label: '概要' },
                    { href: '#steps', label: 'ステップ解説' },
                    { href: '#code', label: 'コード' },
                    { href: '#diagram', label: 'フローチャート' },
                    { href: '#complexity', label: '計算量' },
                    { href: '#glossary', label: '📖 用語集' },
                ];
                return (
                    <header
                        id="header"
                        className="mb-8 rounded-2xl p-8 shadow-[0_10px_30px_rgba(16,185,129,0.12)] bg-[linear-gradient(135deg,#d1fae5,#bfdbfe)]"
                    >
                        <div className="flex items-center gap-3 mb-2 flex-wrap">
                            <span className="bg-emerald-600 text-white text-sm font-bold px-3 py-1 rounded-full">
                                LeetCode 141
                            </span>
                            <span className="bg-sky-500 text-white text-sm font-bold px-3 py-1 rounded-full">
                                Easy
                            </span>
                        </div>
                        <h1 className="outfit text-[2.4rem] font-extrabold text-teal-900 mb-1 leading-tight">
                            Linked List Cycle
                        </h1>
                        <p className="text-lg text-cyan-700 font-semibold mt-1">
                            高速・低速ポインタ法（Floyd's Tortoise and Hare）による O(n) 時間・O(1)
                            空間の実装
                        </p>

                        <p className="mt-3 text-base text-teal-800 bg-white/60 rounded-xl px-4 py-3 inline-block">
                            💡
                            一言で言うと：「連結リストをたどっていったとき、同じノードに戻ってきてしまう輪っか（サイクル）があるかを判定する問題」です。
                        </p>

                        <nav className="flex flex-wrap gap-3 mt-6">
                            {navItems.map((item) => (
                                <a
                                    key={item.href}
                                    href={item.href}
                                    className="inline-block px-4 py-2 font-semibold text-slate-700 no-underline rounded-lg border-2 border-slate-200 bg-white transition hover:shadow-[0_6px_16px_rgba(15,118,110,0.20)] hover:-translate-y-0.5 hover:bg-[linear-gradient(180deg,#e8fff6,#c8f1e1)] hover:border-teal-600 text-sm"
                                >
                                    {item.label}
                                </a>
                            ))}
                        </nav>
                    </header>
                );
            }

            /* ============ 概要 ============ */
            function Overview() {
                const metrics = [
                    { key: 'O(n)', label: '時間計算量', bg: '#d1fae5', fg: '#065f46' },
                    { key: 'O(1)', label: '空間計算量', bg: '#bfdbfe', fg: '#1e40af' },
                    { key: 'ListNode', label: '使うデータ構造', bg: '#fef3c7', fg: '#92400e' },
                    { key: 'Two Pointers', label: '採用テクニック', bg: '#ede9fe', fg: '#5b21b6' },
                ];
                const examples = [
                    {
                        input: 'head = [3,2,0,-4], pos = 1',
                        output: 'true',
                        why: '末尾の -4 が インデックス1（値2）のノードに戻るため、輪っかが存在する。',
                    },
                    {
                        input: 'head = [1,2], pos = 0',
                        output: 'true',
                        why: '末尾の 2 が インデックス0（値1）のノードに戻るため、輪っかが存在する。',
                    },
                    {
                        input: 'head = [1], pos = -1',
                        output: 'false',
                        why: 'pos = -1 は「どこにも戻らない」ことを意味し、リストはそのまま終端に到達する。',
                    },
                ];
                return (
                    <section id="overview" className="bg-white rounded-2xl p-8 mb-8 shadow">
                        <h2 className="outfit text-[1.9rem] font-bold text-cyan-700 mb-4 pb-2 border-b-[3px] border-emerald-200">
                            アルゴリズム概要
                        </h2>

                        <div className="mb-5 p-4 rounded-xl bg-emerald-50 border-l-4 border-emerald-500">
                            <p className="text-emerald-800 font-semibold text-base">
                                💡
                                この問題を一言で言うと：「連結リストをたどっていったとき、以前に通ったノードにまた戻ってきてしまう輪っかがあるかを判定する問題」です。
                            </p>
                            <p className="text-slate-600 text-sm mt-2 leading-6">
                                連結リスト（＝ノードが{' '}
                                <code className="bg-white px-1 rounded font-mono text-xs">
                                    next
                                </code>{' '}
                                という矢印でつながった構造）を先頭からたどっていく際、輪っかがあると「終端（None）」にたどり着けません。そこで、有限のステップで確実に判定できる工夫が必要になります。
                            </p>
                        </div>

                        <div className="mb-5 p-4 rounded-xl bg-amber-50 border-l-4 border-amber-400">
                            <p className="text-amber-800 font-semibold text-sm mb-2">
                                ⚠️ なぜ単純な方法では解けないのか
                            </p>
                            <ul className="text-slate-600 text-sm space-y-1 list-disc list-inside leading-6">
                                <li>
                                    「nextを順番にたどってNoneを待つ」だけの実装だと、サイクルがある場合に永遠に終わらない（無限ループになる）危険がある。
                                </li>
                                <li>
                                    訪問済みノードを配列や集合に記録する方法は正しく動くが、メモリ効率が悪化する（O(n)の追加メモリが必要）。
                                </li>
                            </ul>
                        </div>

                        <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
                            {metrics.map((m) => (
                                <div
                                    key={m.label}
                                    style={{ background: m.bg, color: m.fg }}
                                    className="rounded-xl p-3 text-center"
                                >
                                    <div className="font-bold text-xs font-mono break-all leading-tight">
                                        {m.key}
                                    </div>
                                    <div className="text-xs mt-1">{m.label}</div>
                                </div>
                            ))}
                        </div>

                        <p className="text-slate-700 font-semibold text-sm mb-3">
                            📥 入出力例と正解の理由
                        </p>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                            {examples.map((ex, i) => (
                                <div
                                    key={i}
                                    className="rounded-xl border border-slate-200 p-4 bg-slate-50"
                                >
                                    <div className="font-mono text-xs text-slate-600 break-all">
                                        {ex.input}
                                    </div>
                                    <div className="mt-2 font-mono text-sm font-bold text-teal-700">
                                        出力: {ex.output}
                                    </div>
                                    <div className="mt-2 text-xs text-slate-500 leading-5">
                                        {ex.why}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </section>
                );
            }

            /* ============ ステップ可視化 ============ */
            function StepVisualization({ visualKey }) {
                const nodeValues = [3, 2, 0, -4];
                const pointerStateByVisual = {
                    validate: { slow: null, fast: null, matched: false, finalResult: false },
                    init: { slow: 0, fast: 0, matched: false, finalResult: false },
                    iter1: { slow: 1, fast: 2, matched: false, finalResult: false },
                    iter2: { slow: 2, fast: 1, matched: false, finalResult: false },
                    iter3: { slow: 3, fast: 3, matched: true, finalResult: false },
                    result: { slow: 3, fast: 3, matched: true, finalResult: true },
                };
                const state = pointerStateByVisual[visualKey] || pointerStateByVisual.validate;

                return (
                    <div className="mt-4">
                        <div className="relative bg-slate-50 border border-slate-200 rounded-2xl p-6 pt-12 overflow-x-auto">
                            <div className="flex items-center justify-center gap-1 min-w-[440px]">
                                {nodeValues.map((val, idx) => {
                                    const isSlow = state.slow === idx;
                                    const isFast = state.fast === idx;
                                    const isBoth = isSlow && isFast;
                                    return (
                                        <React.Fragment key={idx}>
                                            <div className="relative flex flex-col items-center">
                                                <div className="absolute -top-9 flex flex-col items-center h-8 justify-end w-max">
                                                    {isBoth && (
                                                        <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-400 text-amber-900 whitespace-nowrap">
                                                            🐢🐇 一致！
                                                        </span>
                                                    )}
                                                    {!isBoth && isSlow && (
                                                        <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-500 text-white whitespace-nowrap">
                                                            🐢 slow
                                                        </span>
                                                    )}
                                                    {!isBoth && isFast && (
                                                        <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-sky-500 text-white whitespace-nowrap">
                                                            🐇 fast
                                                        </span>
                                                    )}
                                                </div>

                                                <div
                                                    className={[
                                                        'w-16 h-16 rounded-xl border-2 flex items-center justify-center font-mono font-bold text-lg transition-all duration-500',
                                                        isBoth
                                                            ? 'bg-amber-100 border-amber-500 text-amber-900 scale-110 shadow-[0_0_0_4px_rgba(245,158,11,0.25)]'
                                                            : isSlow
                                                              ? 'bg-emerald-50 border-emerald-500 text-emerald-800'
                                                              : isFast
                                                                ? 'bg-sky-50 border-sky-500 text-sky-800'
                                                                : 'bg-white border-slate-300 text-slate-600',
                                                    ].join(' ')}
                                                >
                                                    {val}
                                                </div>
                                                <div className="mt-2 text-[11px] text-slate-400 font-mono">
                                                    idx {idx}
                                                </div>
                                            </div>
                                            {idx < nodeValues.length - 1 && (
                                                <div className="text-slate-300 text-2xl px-1 select-none">
                                                    →
                                                </div>
                                            )}
                                        </React.Fragment>
                                    );
                                })}
                            </div>

                            <div className="mt-4 flex items-center justify-center">
                                <svg
                                    width="260"
                                    height="40"
                                    viewBox="0 0 260 40"
                                    role="img"
                                    aria-label="cycle back pointer"
                                >
                                    <defs>
                                        <marker
                                            id="cycle-arrow"
                                            markerWidth="8"
                                            markerHeight="8"
                                            refX="7"
                                            refY="3"
                                            orient="auto"
                                            markerUnits="strokeWidth"
                                        >
                                            <path d="M0,0 L0,6 L7,3 z" fill="#a855f7" />
                                        </marker>
                                    </defs>
                                    <path
                                        d="M 240 5 C 240 35, 20 35, 20 5"
                                        fill="none"
                                        stroke="#a855f7"
                                        strokeWidth="2"
                                        strokeDasharray="4 3"
                                        markerEnd="url(#cycle-arrow)"
                                    />
                                    <text
                                        x="130"
                                        y="24"
                                        textAnchor="middle"
                                        fontSize="11"
                                        fill="#7e22ce"
                                        fontFamily="monospace"
                                    >
                                        -4.next はidx1に戻る（サイクル）
                                    </text>
                                </svg>
                            </div>
                        </div>

                        <div className="mt-3 p-4 rounded-xl bg-slate-900 border border-slate-700 font-mono text-xs leading-6">
                            <div className="text-slate-400 mb-2 font-sans text-xs font-semibold">
                                🔍 現在の変数の状態
                            </div>
                            <div className="text-emerald-400">
                                slow ={' '}
                                {state.slow === null
                                    ? 'まだ未設定'
                                    : 'idx ' + state.slow + '（値 ' + nodeValues[state.slow] + '）'}
                            </div>
                            <div className="text-sky-400">
                                fast ={' '}
                                {state.fast === null
                                    ? 'まだ未設定'
                                    : 'idx ' + state.fast + '（値 ' + nodeValues[state.fast] + '）'}
                            </div>
                            <div className="text-amber-300 mt-1">
                                slow is fast →{' '}
                                {state.slow === null ? '—' : state.matched ? 'True' : 'False'}
                            </div>
                            {state.finalResult && (
                                <div className="text-amber-200 mt-2 font-sans font-bold">
                                    ✅ 戻り値: True（サイクルを検出）
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            /* ============ ステップ解説セクション ============ */
            function StepsSection() {
                const [activeStep, setActiveStep] = useState(1);
                const [isPlaying, setIsPlaying] = useState(false);
                const timerRef = useRef(null);

                const stepsData = [
                    {
                        step: 1,
                        title: '入力を検証する',
                        desc:
                            'まず head が None（空リスト）か、head.next が None（次のノードが存在しない）かを確認します。' +
                            'なぜなら、head が None または head.next が None の場合は次へ進むポインタ操作ができず、サイクルが存在しないからです。' +
                            '例）head=[3,2,0,-4] の場合、どちらの条件にも当てはまらないので次のステップへ進みます。',
                        visual: 'validate',
                    },
                    {
                        step: 2,
                        title: 'slowとfastを初期化する',
                        desc:
                            '遅いポインタ slow と速いポインタ fast を、両方とも head（先頭ノード）で初期化します。' +
                            'なぜなら、2つのポインタを同じ場所からスタートさせ、進む速さの差だけでサイクルを検出したいからです。' +
                            '例）slow = 3, fast = 3（どちらも先頭ノードを指す）。',
                        visual: 'init',
                    },
                    {
                        step: 3,
                        title: '1周目：slowを1歩・fastを2歩進める',
                        desc:
                            'slow を1歩、fast を2歩進めます。' +
                            'なぜなら、fast が slow より速く進むことで、輪っかの中にいる場合は必ずいつか追いつく性質を利用するからです。' +
                            '例）slow は 3→2 に、fast は 3→2→0 に進みます。まだ一致しません。',
                        visual: 'iter1',
                    },
                    {
                        step: 4,
                        title: '2周目：さらに1歩・2歩進める',
                        desc:
                            '再び slow を1歩、fast を2歩進めます。' +
                            'なぜなら、1回のループでは追いつかないことが多く、輪っかの中を周回するまで繰り返す必要があるからです。' +
                            '例）slow は 2→0、fast は 0→-4→2（-4 の次はインデックス1の2に戻る）。まだ一致しません。',
                        visual: 'iter2',
                    },
                    {
                        step: 5,
                        title: '3周目：追いつく瞬間',
                        desc:
                            'もう一度 slow を1歩、fast を2歩進めます。' +
                            'なぜなら、輪っかの中では速度差1のポインタが必ずいつか同じ場所に重なるからです。' +
                            '例）slow は 0→-4、fast は 2→0→-4。両方とも -4 のノードを指し、一致します！',
                        visual: 'iter3',
                    },
                    {
                        step: 6,
                        title: 'サイクルを検出してTrueを返す',
                        desc:
                            'slow is fast が成立したので、サイクルが存在すると判定して True を返します。' +
                            'なぜなら、輪っかがなければ2つのポインタが同じノードに重なることは起こり得ないため、一致=輪っかの存在の確実な証拠になるからです。' +
                            '例）今回の入力 [3,2,0,-4] はサイクルを含むため、最終的な出力は True です。',
                        visual: 'result',
                    },
                ];

                useEffect(() => {
                    if (isPlaying) {
                        if (activeStep >= stepsData.length) {
                            timerRef.current = setTimeout(() => {
                                setActiveStep(1);
                                setIsPlaying(false);
                            }, 1800);
                        } else {
                            timerRef.current = setTimeout(() => {
                                setActiveStep((prev) => prev + 1);
                            }, 1800);
                        }
                    }
                    return () => {
                        if (timerRef.current) clearTimeout(timerRef.current);
                    };
                }, [isPlaying, activeStep]);

                const handleStepClick = (n) => {
                    setActiveStep(n);
                    setIsPlaying(false);
                };
                const handlePlay = () => setIsPlaying(true);

                const currentStepData =
                    stepsData.find((s) => s.step === activeStep) || stepsData[0];

                return (
                    <section id="steps" className="bg-white rounded-2xl p-8 mb-8 shadow">
                        <h2 className="outfit text-[1.9rem] font-bold text-cyan-700 mb-4 pb-2 border-b-[3px] border-emerald-200">
                            ステップバイステップ解説
                        </h2>

                        <div className="grid grid-cols-1 md:grid-cols-[1fr_2fr] gap-8 mt-2">
                            <div>
                                <h3 className="mt-0 mb-4 text-teal-800 text-xl font-semibold">
                                    ステップ一覧
                                </h3>
                                <div className="space-y-2">
                                    {stepsData.map((step) => {
                                        const isActive = activeStep === step.step;
                                        return (
                                            <button
                                                key={step.step}
                                                type="button"
                                                className={[
                                                    'w-full text-left text-[0.95rem] rounded-xl border-2 transition cursor-pointer px-4 py-4',
                                                    'bg-white border-slate-200 hover:border-emerald-500 hover:translate-x-1',
                                                    isActive
                                                        ? 'bg-[linear-gradient(135deg,#d1fae5,#a7f3d0)] border-emerald-500 shadow-[0_4px_12px_rgba(16,185,129,0.20)]'
                                                        : '',
                                                ].join(' ')}
                                                onClick={() => handleStepClick(step.step)}
                                                aria-label={
                                                    'ステップ' + step.step + ': ' + step.title
                                                }
                                                aria-current={isActive ? 'step' : undefined}
                                            >
                                                <div
                                                    className={[
                                                        'font-bold mb-1',
                                                        isActive
                                                            ? 'text-emerald-900'
                                                            : 'text-teal-800',
                                                    ].join(' ')}
                                                >
                                                    Step {step.step}: {step.title}
                                                </div>
                                                <div className="text-slate-500 text-sm mt-1">
                                                    {step.desc.substring(0, 44)}
                                                    {step.desc.length > 44 ? '...' : ''}
                                                </div>
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>

                            <div className="my-auto">
                                {activeStep > 1 && (
                                    <div className="mb-3 px-4 py-2 rounded-lg bg-slate-100 border border-slate-200 text-xs text-slate-500">
                                        ← 前のステップ（Step {activeStep - 1}）では「
                                        {stepsData[activeStep - 2].title}」を行いました
                                    </div>
                                )}

                                <div
                                    key={activeStep}
                                    className="step-panel-anim rounded-2xl p-6 border-2 border-emerald-200 bg-[linear-gradient(135deg,#ecfdf5,#f0f9ff)]"
                                >
                                    <h3 className="mt-0 text-teal-800 text-lg font-bold">
                                        Step {currentStepData.step}: {currentStepData.title}

            /* ============ コードセクション ============ */

                const codeContent = `from __future__ import annotations
from typing import Optional


class ListNode:
    def __init__(self, x: int) -> None:
        self.val = x
        self.next: Optional["ListNode"] = None


class Solution:
    def hasCycle(self, head: Optional[ListNode]) -> bool:
        # 基底条件: ノードが0個か1個ならサイクルは作れない
        if head is None or head.next is None:
            return False

        # 遅いポインタ(亀)と速いポインタ(兎)を先頭で初期化
        slow: Optional[ListNode] = head
        fast: Optional[ListNode] = head

        # fastが2歩先まで進める間だけループを継続
        while fast is not None and fast.next is not None:
            slow = slow.next          # 亀は1歩進む
            fast = fast.next.next     # 兎は2歩進む

            # 同じノードを指していたらサイクル確定
            if slow is fast:
                return True

        # ループを抜けた = fastが終端Noneに到達 = サイクルなし
        return False`;

1周目: slow = 2, fast = 0     → slow is fast ? No
2周目: slow = 0, fast = 2     → slow is fast ? No
3周目: slow = -4, fast = -4   → slow is fast ? Yes!

出力: True`}
