    def removeDuplicates(self, nums: List[int]) -> int:
        # リストが空の場合、ユニークな要素は0個なのでそのまま0を返す。
        # （この問題の制約では nums.length >= 1 が保証されているが、
        #  防御的プログラミングとして安全側に倒しておく）

        # slow は「最後に確定したユニークな値」が置かれているインデックス。
        # 最初はインデックス0の要素（nums[0]）が唯一の確定済みユニーク値
        # なので0から始める。
        slow: int = 0

        # fast はこれから調べていく値を指すインデックス。
        # range(1, len(nums)) は「1以上 len(nums) 未満」の範囲を生成する
        # （終端 len(nums) を含まない）。enumerate() ではなく range() を
        # 使うのは、nums[slow] という「別のインデックス」も同時に参照する
        # 必要があるため。
        for fast in range(1, len(nums)):
            # nums はソート済みなので、同じ値は必ず隣接している。
            # fast が指す値が、直近の確定済みユニーク値（nums[slow]）と
            # 異なるなら、それは「新しく見つかったユニークな値」という
            # ことになる。

                # slow をひとつ進めて「次にユニーク値を書き込む位置」を確保する

                # 新しく見つかったユニーク値を、確定済み領域の直後
                # （nums[slow]）に書き込む
                nums[slow] = nums[fast]

            # （何もしないことがそのまま「重複を無視する」処理になる）

        # slow は0始まりのインデックスなので、要素の個数に直すには+1する
        return slow + 1`,

 * ソート済み配列から重複要素を取り除き、前方にユニークな値だけを詰め直す。
 * nums が参照する配列そのものを直接書き換える（in-place）。
 *
 * @param nums - 非減少順にソートされた数値配列
 * @returns 重複を除いたあとのユニークな要素数 k
 * @throws {TypeError} nums が配列でない場合
 * @complexity Time: O(n), Space: O(1)
 */
function removeDuplicates(nums: number[]): number {
    // 型ガード：nums が本当に配列かどうかを実行時にも確認する。
    // なぜ必要か：TypeScript の型チェックはコンパイル時のみ有効であり、
    // JavaScript として実行される段階ではこのチェックは消えてしまう。
    // 外部から不正な値が渡されるケース（型定義を無視した呼び出しなど）
    // に備える。
    if (!Array.isArray(nums)) {
        throw new TypeError('Input must be an array');
    }

    // 配列が空の場合、ユニークな要素は0個なのでそのまま0を返す。
    // （この問題の制約では nums.length >= 1 が保証されているが、
    //  防御的プログラミングとして安全側に倒しておく）
    if (nums.length === 0) {
        return 0;
    }

    // slow は「最後に確定したユニークな値」が置かれているインデックス。
    // let を使うのは、ループの中で再代入され続ける変数だから
    // （TypeScript/JavaScript では再代入不要な変数には const を
    //  使うのが慣習）。
    let slow = 0;

    // fast はこれから調べていく値を指すインデックス。
    // インデックス1から末尾まで、配列を1回だけなめる（1パス）。
    for (let fast = 1; fast < nums.length; fast++) {
        // 配列はソート済みなので、同じ値は必ず隣接している。
        // !== を使うのは、TypeScript/JavaScript では型変換を伴わない
        // 厳密等価演算子を使うのが一般的な慣習であるため
        // （== は型変換によって意図しない一致が起こりうる）。
        if (nums[fast] !== nums[slow]) {
            // slow をひとつ進めて「次にユニーク値を書き込む位置」を確保する
            slow++;
            // 新しく見つかったユニーク値を、確定済み領域の直後に書き込む
            nums[slow] = nums[fast];
        }
        // nums[fast] === nums[slow] の場合は「すでに確認済みの値の
        // 重複」なので、何もせずに for ループの fast++ によって
        // 次の要素へ進む
    }

    // slow は0始まりのインデックスなので、要素の個数に直すには+1する
    return slow + 1;
}`,

func removeDuplicates(nums []int) int {
	// スライスが空の場合、ユニークな要素は0個なのでそのまま0を返す。
	// なぜ最初にチェックするか：この後 nums[0] にアクセスするコードを

	// 以降の書き込みは呼び出し元にも反映される。

		return 0
	}

	// slow は「最後に確定したユニークな値」が置かれているインデックス。
	// 最初はインデックス0の要素（nums[0]）が唯一の確定済みユニーク値
	// なので0から始める。
	slow := 0

	// fast はこれから調べていく値を指すインデックス。
	// インデックス1から末尾まで、スライスを1回だけなめる（1パス）。
	// range を使わず古典的な for 文にしているのは、nums[slow] という

	// （range は現在の要素の値しか直接くれない）。
	for fast := 1; fast < len(nums); fast++ {
		// スライスはソート済みなので、同じ値は必ず隣接している。
		// fast が指す値が、直近の確定済みユニーク値（nums[slow]）と

			slow++
			// 新しく見つかったユニーク値を、確定済み領域の直後

		// 重複」なので、何もせずに for 文の fast++ によって
		// 次の要素へ進む
	}

	return slow + 1
}`,

    /// ソート済みベクタから重複要素を取り除き、前方にユニークな値だけを詰め直す。
    /// nums が指すベクタ本体を直接書き換える（in-place）。
    ///
    /// # Complexity
    /// - Time: O(n)
    /// - Space: O(1)
    pub fn remove_duplicates(nums: &mut Vec<i32>) -> i32 {
        // ベクタが空の場合、ユニークな要素は0個なのでそのまま0を返す。
        // なぜ最初にチェックするか：この後 nums[0] 相当のアクセスで

        if nums.is_empty() {
            return 0;
        }

        // slow は「最後に確定したユニークな値」が置かれているインデックス。
        // usize はインデックス専用の符号なし整数型
        // （負の値を扱えないことで意図しないマイナス値の混入を防げる）。
        let mut slow: usize = 0;

            /* ============================================================
   CodeBlockView: Prism.js統合コンポーネント（必須実装パターン）
   ReactのDOM管理とPrismのDOM書き換えが衝突しないよう、
   key={lang} で言語切替時に完全に作り直し、useEffectで
   Prism.highlightElement を呼ぶことで安全に共存させる。
   ============================================================ */
            function CodeBlockView({ code, lang }) {
                const codeRef = useRef(null);

                useEffect(() => {
                    if (codeRef.current && window.Prism) {
                        window.Prism.highlightElement(codeRef.current);
                    }
                }, [code, lang]);

                return (
                    <pre
                        key={lang}
                        className="code-surface rounded-2xl overflow-x-auto p-5 text-[0.92rem] leading-7 shadow-inner"
                    >
                        <code ref={codeRef} className={'language-' + lang}>
                            {code}
                        </code>
                    </pre>
                );
            }

            /* ============================================================
   MermaidDiagram: Mermaid.js統合コンポーネント
   Mermaidが生成するSVGはrefを介して直接innerHTMLに差し込み、
   Reactの再レンダリングと競合しないようにする。
   ============================================================ */
            function MermaidDiagram({ definition, id }) {
                const containerRef = useRef(null);
                const [error, setError] = useState(null);

                useEffect(() => {
                    let cancelled = false;
                    async function render() {
                        if (!window.mermaid || !containerRef.current) return;
                        try {
                            const { svg } = await window.mermaid.render(id, definition);
                            if (!cancelled && containerRef.current) {
                                containerRef.current.innerHTML = svg;
                            }
                        } catch (e) {
                            if (!cancelled) setError(String(e));
                        }
                    }
                    render();
                    return () => {
                        cancelled = true;
                    };
                }, [definition, id]);

                return (
                    <div className="w-full overflow-x-auto">
                        {error ? (
                            <p className="text-rose-600 text-sm">図の描画に失敗しました: {error}</p>
                        ) : (
                            <div
                                ref={containerRef}
                                className="min-w-[640px] flex justify-center py-2"
                            />
                        )}
                    </div>
                );
            }
