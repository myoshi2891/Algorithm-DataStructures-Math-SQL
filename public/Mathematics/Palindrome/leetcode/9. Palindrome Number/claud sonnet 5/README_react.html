            const CODE_CONTENT = `/**
 * 整数 x が回文数（Palindrome Number）かどうかを判定する。
 *
 * 「回文数」とは、前から読んでも後ろから読んでも同じ並びになる整数のこと。
 * 文字列に変換せず、数値の後半部分だけを反転させて前半部分と比較することで
 * follow-up要件（文字列変換なしでの実装）に対応する。
 *
 * @param x - 判定対象の整数。制約: -2**31 <= x <= 2**31 - 1
 * @returns x が回文数であれば true、そうでなければ false
 * @throws {TypeError} x が整数でない場合
 * @throws {RangeError} x が制約範囲外の場合
 * @complexity Time: O(log10 x), Space: O(1)
 */
function isPalindrome(x: number): boolean {
  // Number.isInteger() で「整数かどうか」を実行時にも確認する。
  // TypeScriptの number 型は整数・小数を区別しないため、
  // コンパイル時の型チェックだけでは保証できない。
  if (!Number.isInteger(x)) {
    throw new TypeError('x must be an integer');
  }

  // 32bit符号付き整数の範囲チェック（問題の制約に対応）
  const INT32_MIN = -(2 ** 31);
  const INT32_MAX = 2 ** 31 - 1;
  if (x < INT32_MIN || x > INT32_MAX) {
    throw new RangeError('x is out of the allowed range');
  }

  // エッジケース処理:
  // ・x < 0                     → 先頭に "-" が付くため絶対に回文にならない
  // ・x % 10 === 0 かつ x !== 0 → 反転すると先頭が 0 になり矛盾するため
  //                                絶対に回文にならない（0 自身だけは例外）
  if (x < 0 || (x % 10 === 0 && x !== 0)) {
    return false;
  }

  let original: number = x;
  let revertedHalf: number = 0;

  // original（元の数の前半に相当する残り）と revertedHalf（後半を反転させた数）を、
  // 桁数がちょうど半分ずつ入れ替わるまで競わせる。
  while (original > revertedHalf) {
    // 最下位の桁を取り出し、revertedHalf の末尾に追加する
    revertedHalf = revertedHalf * 10 + (original % 10);

    // 整数除算で最下位の桁を切り捨てる
    original = Math.trunc(original / 10);
  }

  // 桁数が偶数: original と revertedHalf が完全一致
  // 桁数が奇数: revertedHalf の真ん中の桁が1つ多いので /10 で切り捨てて比較
  return original === revertedHalf || original === Math.trunc(revertedHalf / 10);
}`;

Step 4: original(12) > revertedHalf(123) ? → No → ループ終了

最終比較: original(12) === revertedHalf(123) ? → false
          original(12) === trunc(revertedHalf/10)(12) ? → true

出力: true ✅（12321は回文数）`;

            function DiagramSection() {

                // Mermaid定義。配列 + join("\n") で「1行1宣言」ルールを守りやすくする。

                    'flowchart TD',

                    '  CheckTrail -- はい --> RetFalse2[falseを返す]',
                    '  CheckTrail -- いいえ --> Init[originalにxを代入し revertedHalfを0にする]',
                    '  Init --> Loop{originalはrevertedHalfより大きいか}',
                    '  Loop -- はい --> Extract[最下位桁をrevertedHalfへ追加する]',
                    '  Extract --> Shrink[originalの最下位桁を切り捨てる]',
                    '  Shrink --> Loop',
                    '  Loop -- いいえ --> Compare{originalとrevertedHalfが一致するか}',
